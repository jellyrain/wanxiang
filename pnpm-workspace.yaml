packages:
  - '.'
allowBuilds:
  # 13.x ships native binaries for our targets; the implicit node-gyp rebuild needs Python even when a prebuild exists.
  better-sqlite3: false
  electron-winstaller: true
overrides:
  # The 26.18 tool downloader calls ElectronDownloadCacheMode, introduced after get 3.
  'app-builder-lib@26.18.0>@electron/get': 5.1.0
