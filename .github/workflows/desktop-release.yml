name: Desktop builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      signed_mac:
        description: '使用已配置的 Apple 证书签名并公证 Mac 包'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            arch: x64
            output: windows
          - os: macos-15-intel
            platform: mac
            arch: x64
            output: mac-x64
          - os: macos-15
            platform: mac
            arch: arm64
            output: mac-arm64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            output: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      WANXIANG_UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download/
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Install native Electron runtime
        run: pnpm exec install-electron
      - name: Verify architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e "if(process.arch!==process.env.EXPECTED_ARCH)throw Error('Wrong runner architecture')"
      - name: Tests
        run: pnpm test
      - name: Build Windows
        if: matrix.platform == 'windows'
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: pnpm run package:windows
      - name: Build macOS
        if: matrix.platform == 'mac'
        env:
          WANXIANG_MAC_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.signed_mac == true }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm run package:mac
      - name: Build Linux
        if: matrix.platform == 'linux'
        run: pnpm run package:linux
      - name: Check packaged native database and resources
        run: node scripts/verify-platform-package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/${{ matrix.output }}/*.exe
            release/${{ matrix.output }}/*.zip
            release/${{ matrix.output }}/*.dmg
            release/${{ matrix.output }}/*.AppImage
            release/${{ matrix.output }}/*.blockmap
            release/${{ matrix.output }}/latest*.yml
            release/${{ matrix.output }}/latest-portable.json
            release/${{ matrix.output }}/platform-report.json

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          path: release/downloads
      - name: Merge both Mac architectures and verify every update checksum
        run: node scripts/collect-release.mjs release/downloads release/publish --signed
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release/publish/* --verify-tag --draft --title "万象工坊 $GITHUB_REF_NAME" --generate-notes
